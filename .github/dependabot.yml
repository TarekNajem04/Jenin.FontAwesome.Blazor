version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    assignees:
      - "TarekNajem04"
    labels:
      - "dependencies"
      - "nuget"
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Roslyn minor/major bumps change the compiler assembly version the analyzer
    # and code fix build against. A reference newer than the consumer compiler
    # fails builds with CS9057, so Roslyn only moves together with global.json (human
    # decision). Patch updates keep the same compiler assembly version and stay automatic.
    ignore:
      - dependency-name: "microsoft.codeanalysis.*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    assignees:
      - "TarekNajem04"
    labels:
      - "dependencies"
      - "actions"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
