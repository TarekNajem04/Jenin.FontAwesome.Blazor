<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JeninFaApp — Font Awesome for Blazor</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Font Awesome assets (SET-01): host-owned CDN copies plus the matching static
         mode-config file. Standalone WebAssembly has no server pipeline, so there is no
         mapped endpoint — the static file below is the whole config story. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css" />
    <script src="_content/Jenin.FontAwesome.Blazor/js/fontawesome-config-JENIN_FA_CONFIG.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/js/all.min.js" type="text/javascript"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
